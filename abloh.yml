# abloh.yml - read from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#config

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails the check. Blocks merges only if also marked
# required in branch protection.
enforce: true

# Rebuild recipe for the proof container. Comments name the source file.
environment:
  runtimeImage: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d # reviewed Node 24 image (the major init ran under, and a .nvmrc would outrank it)
  installDirectory: .
  setup: .abloh/setup.sh # written by init and yours to edit. Every cold run executes it step by step
  testCommand: node --test --test-reporter=spec "test/**/*.test.js" # set by you
  runner: node-test # abloh measures node-test. But your test script also runs npm run borp (borp runs node:test)
  # no sealedTestCommand - set one if lint, transpile, borp and test-types gets proposed tests rejected
  identityFiles: # a change here triggers reinstall instead of container reuse
    - .npmrc
